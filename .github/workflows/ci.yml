# Pull requests: static checks, secret scan, image build, and a terraform plan for dev.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate
        run: |
          rc=0
          for dir in infra/bootstrap infra/environment; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate -json > validate.json || rc=1
            # Errors and deprecation warnings become PR annotations on the offending line.
            jq -r '.diagnostics[] | [
                (if .severity == "error" then "error" else "warning" end),
                (.range.filename // ""),
                ((.range.start.line // 1) | tostring),
                (.summary + ": " + ((.detail // "") | gsub("\n"; " ")))
              ] | @tsv' validate.json |
            while IFS=$'\t' read -r sev file line msg; do
              [ -n "$file" ] && file="$(realpath -m --relative-to=. "$dir/$file")"
              echo "::${sev} file=${file},line=${line}::${msg}"
            done
          done
          rm -f validate.json
          exit "$rc"

      - name: Secret scan (gitleaks)
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect \
            --source=/repo --config=/repo/.gitleaks.toml --no-git --redact --no-banner \
            --report-format=json --report-path=/repo/gitleaks-report.json
          rc=$?
          set -e
          # Surface each finding as a PR annotation on the offending line.
          if [ -s gitleaks-report.json ]; then
            jq -r '.[] | "::error file=\(.File | ltrimstr("/repo/")),line=\(.StartLine)::gitleaks rule \(.RuleID)"' gitleaks-report.json
          fi
          [ "$rc" -eq 0 ] || echo "::error::gitleaks exited with code $rc"
          exit "$rc"

      - name: Build images (no push)
        run: |
          docker build -t api:ci app/api
          docker build -t worker:ci app/worker

  plan-dev:
    needs: static-checks
    # PRs from forks get no OIDC token for this repo, so only same-repo PRs plan,
    # and only once bootstrap has configured the repository variables. Dependabot
    # runs get neither Actions secrets nor an OIDC token, so they skip the plan too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      vars.AZURE_CLIENT_ID_DEV != ''
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      action: plan
      image_tag: ${{ github.event.pull_request.head.sha }}
      client_id: ${{ vars.AZURE_CLIENT_ID_DEV }}
    secrets:
      alert_email: ${{ secrets.ALERT_EMAIL }}
